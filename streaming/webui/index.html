<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek-V4-Flash — local</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="sb-head">
      <div class="brand">
        <span class="brand-mark">V4</span>
        <span class="brand-name">DeepSeek-V4-Flash<small>local · 284B MoE</small></span>
      </div>
    </div>
    <button id="new-chat" class="new-chat">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New chat
    </button>
    <nav id="session-list" class="session-list" aria-label="Chats"></nav>
    <div class="sb-foot">
      <button id="settings-btn" class="ghost-btn" title="Settings">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 5.2A2.8 2.8 0 1 0 8 10.8 2.8 2.8 0 0 0 8 5.2Zm6-.9-1.1-.3a5 5 0 0 0-.5-1.1l.6-1a.6.6 0 0 0-.1-.8l-1-1a.6.6 0 0 0-.8-.1l-1 .6a5 5 0 0 0-1.1-.4L8.7.3a.6.6 0 0 0-.6-.3H6.9a.6.6 0 0 0-.6.4L6 1.6a5 5 0 0 0-1.1.4l-1-.6a.6.6 0 0 0-.8.1l-1 1a.6.6 0 0 0-.1.8l.6 1a5 5 0 0 0-.4 1.1l-1.2.3a.6.6 0 0 0-.4.6v1.4c0 .3.2.5.4.6l1.2.3a5 5 0 0 0 .4 1.1l-.6 1a.6.6 0 0 0 .1.8l1 1c.2.2.5.3.8.1l1-.6c.4.2.7.3 1.1.4l.3 1.2c.1.3.3.4.6.4h1.4c.3 0 .5-.2.6-.4l.3-1.2c.4-.1.8-.3 1.1-.4l1 .6c.3.2.6.1.8-.1l1-1a.6.6 0 0 0 .1-.8l-.6-1c.2-.4.3-.7.5-1.1l1.1-.3a.6.6 0 0 0 .5-.6V4.9a.6.6 0 0 0-.5-.6Z" fill="currentColor"/></svg>
        Settings
      </button>
      <button id="info-btn" class="ghost-btn" title="About this rig">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="4.8" r=".95" fill="currentColor"/></svg>
        Info
      </button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="sb-toggle" class="icon-btn" title="Toggle sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <h1 id="chat-title">New chat</h1>
      <div class="model-picker" id="model-picker" role="radiogroup" aria-label="Model"></div>
    </header>

    <section id="scroller">
      <div id="thread"></div>
      <div id="empty-state" hidden>
        <div class="hero-mark">V4</div>
        <h2>DeepSeek-V4-Flash, running on this Mac</h2>
        <p>284B parameters streamed from SSD — pick <b>Fast</b> for snappy answers or <b>Quality</b> for the 4/8-bit checkpoint.</p>
        <div class="suggests">
          <button class="suggest">Why is the sky blue?</button>
          <button class="suggest">Write a haiku about SSDs pretending to be RAM</button>
          <button class="suggest">Explain mixture-of-experts models in two paragraphs</button>
        </div>
      </div>
    </section>

    <footer id="composer-wrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Message DeepSeek-V4-Flash…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send-btn" class="send" title="Send" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 12.5v-9M4.2 7.2 8 3.4l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="stop-btn" class="send stop" title="Stop generating" hidden>
          <svg viewBox="0 0 16 16" width="15" height="15"><rect x="4" y="4" width="8" height="8" rx="1.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="foot-note">Local inference only — nothing leaves this machine.</div>
    </footer>
  </main>
</div>

<div id="modal-backdrop" hidden>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>

<template id="tpl-settings">
  <h3>Settings</h3>
  <label class="toggle-row">
    <span>
      <b>Debug details</b>
      <small>Per-message engine, prefill time, decode tok/s, token counts, KV reuse and expert-cache stats.</small>
    </span>
    <input type="checkbox" id="debug-toggle">
    <span class="switch" aria-hidden="true"></span>
  </label>
  <div class="modal-actions"><button class="ghost-btn" data-close>Close</button></div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
